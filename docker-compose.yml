services:
  db:
    image: postgres:16-alpine
    container_name: online_cinema_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema_password
      POSTGRES_DB: online_cinema

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: online_cinema_redis
    restart: unless-stopped

    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    container_name: online_cinema_mailpit
    restart: unless-stopped

    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
