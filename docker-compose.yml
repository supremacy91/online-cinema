services:
  db:
    image: postgres:16-alpine
    container_name: online_cinema_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: online_cinema_redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: online_cinema_mailpit
    restart: unless-stopped

    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:latest
    container_name: online_cinema_minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: online_cinema_web
    restart: unless-stopped

    env_file:
      - .env.docker

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_started

    command:
      [
        "uvicorn",
        "src.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: online_cinema_celery_worker
    restart: unless-stopped

    env_file:
      - .env.docker

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

    command:
      [
        "celery",
        "-A",
        "src.celery_app.celery_app",
        "worker",
        "--loglevel=info"
      ]

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: online_cinema_celery_beat
    restart: unless-stopped

    env_file:
      - .env.docker

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    command:
      [
        "celery",
        "-A",
        "src.celery_app.celery_app",
        "beat",
        "--loglevel=info"
      ]

volumes:
  postgres_data:
  minio_data:
